<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow" />
    <title>HOME | BITEGAMES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Montserrat:wght@100;200;300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="css/slick-theme.css" />
    <link rel="stylesheet" type="text/css" href="css/slick.css" />

    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <!-- subscribe-widget -->
    <div class="subscribe-widget">
        <div class="site-container">
            <div class="subscribe-widget--wrapper">
                <p class="subscribe-widget--content">
                    Your subscription to Bite Games premium
                    has been successfully processed
                </p>
            </div>
        </div>
    </div>
    <!-- subscribe-widget end-->

    <!-- header -->

    <header class="site-header">
        <nav class="site-container">
            <div class="menu-wrapper">
                <div class="menu-btn"></div>

                <a class="lang--switcher" href="index_ar.html">
                    AR
                </a>
            </div>
            <a href="index.html" class="logo">
                <img src="images/logo-white.png" alt="logo" />
            </a>
            <div class="user-wrapper">
                <div class="user-icon">
                    <img src="images/user.png" alt="user" />
                </div>
            </div>
        </nav>
    </header>
    <!-- header end -->

    <main>
        <article>
            <section>
                <div class="site-container" id="hero">

                    <!-- carousel -->
                    <div class="home-carousel">
                        <div class="home-carousel--slide-wrpapper">
                            <div class="home-carousel--slide">
                                <img src="images/slider.png" alt="slide" />
                            </div>
                        </div>
                        <div class="home-carousel--slide-wrpapper">
                            <div class="home-carousel--slide">
                                <img src="images/slider.png" alt="slide" />
                            </div>
                        </div>
                        <div class="home-carousel--slide-wrpapper">
                            <div class="home-carousel--slide">
                                <img src="images/slider.png" alt="slide" />
                            </div>
                        </div>
                    </div>
                    <!-- carousel end -->

                </div>
            </section>


            <!-- subscribe-form -->
            <div id="subscribe" class="subscribe-form">
                <a href="subscribe.html" class="link-wrapper">
                    <button type="button" class="subscribe-form--button">SUBSCRIBE</button>
                </a>
            </div>
            <!-- subscribe-form end-->

            <div class="separator"></div>

            <section>
                <div class="site-container" id="features">

                    <!-- section title -->
                    <h2 class="section-title">
                        New Games
                        <div class="games-counter" itmes-counter="6"></div>
                    </h2>
                    <!-- section title end -->

                    <!-- elems grid  -->
                    <div class="games-grid">
                        <div class="games-grid--card">
                            <a class="games-content">
                                <img src="images/games-q/Rectangle 17.png" alt="game title" loading="lazy"
                                    class="fluid-image" />
                            </a>
                        </div>
                        <div class="games-grid--card">
                            <a class="games-content">
                                <img src="images/games-q/Rectangle 22.png" alt="game title" loading="lazy"
                                    class="fluid-image" />
                            </a>
                        </div>
                        <div class="games-grid--card">
                            <a class="games-content">
                                <img src="images/games-q/Rectangle 23.png" alt="game title" loading="lazy"
                                    class="fluid-image" />
                            </a>
                        </div>
                        <div class="games-grid--card">
                            <a class="games-content">
                                <img src="images/games-q/Rectangle 24.png" alt="game title" loading="lazy"
                                    class="fluid-image" />
                            </a>
                        </div>
                        <div class="games-grid--card">
                            <a class="games-content">
                                <img src="images/games-q/Rectangle 25.png" alt="game title" loading="lazy"
                                    class="fluid-image" />
                            </a>
                        </div>
                        <div class="games-grid--card">
                            <a class="games-content">
                                <img src="images/games-q/Rectangle 26.png" alt="game title" loading="lazy"
                                    class="fluid-image" />
                            </a>
                        </div>
                    </div>
                    <!-- elems grid  end -->

                    <!-- load more -->
                    <div class="load-more--wrapper">
                        <h2 class="load-more--title">
                            More Games
                        </h2>
                        <form>
                            <button class="load-more--button" type="button"></button>
                        </form>
                    </div>
                    <!-- load more end -->
                </div>
            </section>


            <section>
                <div class="site-container" id="popular">

                    <!-- section title -->
                    <h2 class="section-title">
                        Popular Games
                        <div class="games-counter" itmes-counter="5"></div>
                    </h2>

                    <!-- section title end -->

                    <!-- popular list -->
                    <div class="popular-games--list">
                        <a class="popular-game" href="#">
                            <img src="images/games-p/Rectangle 28.png" alt="game title" loading="lazy"
                                class="fluid-image" />
                        </a>
                        <a class="popular-game" href="#">
                            <img src="images/games-p/Rectangle 29.png" alt="game title" loading="lazy"
                                class="fluid-image" />
                        </a>
                        <a class="popular-game" href="#">
                            <img src="images/games-p/Rectangle 30.png" alt="game title" loading="lazy"
                                class="fluid-image" />
                        </a>
                        <a class="popular-game" href="#">
                            <img src="images/games-p/Rectangle 35.png" alt="game title" loading="lazy"
                                class="fluid-image" />
                        </a>
                        <a class="popular-game" href="#">
                            <img src="images/games-p/Rectangle 57.png" alt="game title" loading="lazy"
                                class="fluid-image" />
                        </a>
                    </div>
                    <!-- popular list end -->
                </div>
            </section>

            <section id="contacts">
                <div class="site-container">

                    <!-- contacts -->

                    <div class="contacts-grid">
                        <div class="contacts-grid--card">
                            <a href="#" class="content ">
                                Contact us
                            </a>
                        </div>
                        <div class="contacts-grid--card">
                            <a href="#" class="content">
                                FAQ
                            </a>
                        </div>
                    </div>

                    <!-- contacts end -->
                </div>
            </section>
        </article>

    </main>

    <!-- footer -->
    <footer class="site-footer">
        <div class="site-container">
            <div class="logo">
                <img src="images/footer-logo.png" alt="logo" />
            </div>
            <p class="copyright">© <span>BITEGAMES</span> 2020 All rights reserved</p>
        </div>
    </footer>
    <!-- footer end -->
    <script src="js/jquery-3.6.1.min.js"></script>
    <script src="js/slick.js"></script>
    <script src="js/slick.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/homecarousel.js"></script>
</body>

</html>
